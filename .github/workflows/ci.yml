name: FlightProof CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install contract tooling
        run: python -m pip install -r requirements.txt
      - name: GenVM lint and validation
        run: genvm-lint check contracts/flight_proof.py --json
      - name: Strict contract type-check
        run: genvm-lint typecheck contracts/flight_proof.py --strict --json
      - name: Direct-mode contract tests
        run: pytest tests/direct -v

  adapters-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Source adapter tests
        run: pnpm test:adapters
      - name: Deployment script type-check
        run: pnpm typecheck:deploy
      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level high
